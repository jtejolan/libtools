<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173f35" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Unsubscribe — Book Club</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/library-tools-logo-classic.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/platform.css?v=9" />
    <script src="/static/dom-utils.js?v=1" defer></script>
    <script src="/static/bookclub-unsubscribe.js?v=1" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="/"><img src="/static/assets/library-tools-logo-classic.svg?v=2" alt="" /><span>Book Club</span></a>
      </header>

      <main class="auth-layout">
        <div class="auth-story">
          <p class="eyebrow">Email preferences</p>
          <h1 id="unsubscribe-heading">Unsubscribe</h1>
          <p id="unsubscribe-message">Checking this link…</p>
        </div>

        <div class="auth-card" id="unsubscribe-card" hidden>
          <p class="muted" id="unsubscribe-copy"></p>
          <button class="primary-button full" id="confirm-unsubscribe">Confirm unsubscribe</button>
          <p class="form-error" id="unsubscribe-error"></p>
        </div>

        <div class="auth-card" id="unsubscribe-result" hidden>
          <h2 id="unsubscribe-result-heading"></h2>
          <p class="muted" id="unsubscribe-result-message"></p>
        </div>
      </main>
    </div>
  </body>
</html>
