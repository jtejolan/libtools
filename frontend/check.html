<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#173f35"/><meta name="robots" content="noindex,nofollow"/><title>Lendery Quick Check — Library Tools</title><link rel="icon" type="image/svg+xml" href="/static/assets/library-tools-logo-classic.svg?v=2"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet"/><link rel="stylesheet" href="/static/platform.css?v=20"/><link rel="stylesheet" href="/static/check.css?v=4"/><script src="/static/dom-utils.js?v=1" defer></script><script src="/static/check.js?v=3" defer></script></head>
<body>
<div class="shell">
  <main class="check-layout">
    <div class="check-glow" aria-hidden="true"></div>
    <div class="check-intro">
      <a class="check-icon" href="https://libtools.app" aria-label="Library Tools home"><img src="/static/assets/lendery-logo-symbol-v3.png?v=4" alt=""/></a>
      <p class="eyebrow">Barcode lookup</p>
      <h1>Lendery Quick Check</h1>
      <p class="check-lede">Scan or type a barcode to see the item and check off what should be inside it.</p>
    </div>
    <form class="check-form" id="check-form">
      <label for="check-input" class="check-input-label">Barcode</label>
      <div class="check-input-row">
        <input type="text" id="check-input" autocomplete="off" autofocus placeholder="Scan or type a barcode, then press Enter…" />
      </div>
    </form>
    <section class="check-result" id="check-result" hidden></section>
  </main>
</div>
</body>
</html>
