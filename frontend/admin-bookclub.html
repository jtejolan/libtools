<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#173f35" />
    <title>Self-serve clubs — Library Tools</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/library-tools-logo-classic.svg?v=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/platform.css?v=16" />
    <script src="/static/dom-utils.js?v=1" defer></script>
    <script src="/static/admin-bookclub.js?v=1" defer></script>

  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="/dashboard"><img src="/static/assets/library-tools-logo-classic.svg?v=1" alt="" /><span>Library Tools</span></a>
        <div class="header-actions"><a class="text-link" href="/admin/accounts">Accounts</a><a class="text-link" href="/dashboard">Dashboard</a><button class="quiet-button" id="logout">Log out</button></div>
      </header>

      <main class="admin-layout">
        <div class="page-heading account-admin-heading">
          <div><p class="eyebrow">Libtools administration</p><h1>Self-serve book clubs</h1><p class="dashboard-lede">Clubs created directly on bookclub.libtools.app, with their own facilitator accounts — invisible to the staff Book Club Manager tool. Read-only, for support and abuse triage.</p></div>
          <div class="account-summary" aria-label="Club summary"><span><strong id="club-total">—</strong> total</span><span><strong id="participant-total">—</strong> participants</span></div>
        </div>

        <section class="panel">
          <div class="user-list" id="club-list"></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
  </body>
